name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  SONAR_PROJECT_KEY: CodeMaru-Dreamine_Dreamine.MVVM.Core
  SONAR_ORGANIZATION: codemaru-dreamine
  SONAR_PROJECT_VERSION: 1.0.13
  SONAR_SCANNER_VERSION: 11.2.1
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

jobs:
  build-test-analyze:
    name: Build, test, package, and analyze
    runs-on: windows-2025
    steps:
      - name: Check out package
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: src/Core
          fetch-depth: 0

      - name: Check out Attributes dependency
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: CodeMaru-Dreamine/Dreamine.MVVM.Attributes
          path: src/Attributes

      - name: Check out Locators dependency
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: CodeMaru-Dreamine/Dreamine.MVVM.Locators
          path: src/Locators

      - name: Check out Interfaces dependency
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: CodeMaru-Dreamine/Dreamine.MVVM.Interfaces
          path: src/Interfaces

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 8.0.x

      - name: Install analysis tools
        if: env.SONAR_TOKEN != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        shell: pwsh
        run: |
          dotnet tool install --global dotnet-sonarscanner --version $env:SONAR_SCANNER_VERSION
          dotnet tool install --global dotnet-coverage

      - name: Align SonarCloud project settings
        if: env.SONAR_TOKEN != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        shell: pwsh
        run: |
          $basicToken = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("$($env:SONAR_TOKEN):"))
          $headers = @{ Authorization = "Basic $basicToken" }
          Invoke-RestMethod -Method Post -Uri 'https://sonarcloud.io/api/autoscan/activation' -Headers $headers -ContentType 'application/x-www-form-urlencoded' -Body @{ projectKey = $env:SONAR_PROJECT_KEY; enable = 'false' } | Out-Null

      - name: Restore
        working-directory: src/Core
        run: dotnet restore tests/Dreamine.MVVM.Core.Tests/Dreamine.MVVM.Core.Tests.csproj

      - name: Begin Sonar analysis
        if: env.SONAR_TOKEN != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        working-directory: src/Core
        shell: pwsh
        run: >
          dotnet sonarscanner begin
          /k:"$env:SONAR_PROJECT_KEY"
          /o:"$env:SONAR_ORGANIZATION"
          /v:"$env:SONAR_PROJECT_VERSION"
          /d:sonar.token="$env:SONAR_TOKEN"
          /d:sonar.cs.vscoveragexml.reportsPaths="coverage.xml"
          /d:sonar.coverage.exclusions="**/tests/**"
          /d:sonar.scanner.scanAll=false

      - name: Build and test
        working-directory: src/Core
        shell: pwsh
        run: |
          dotnet build tests/Dreamine.MVVM.Core.Tests/Dreamine.MVVM.Core.Tests.csproj --configuration Release --no-restore
          if ($env:SONAR_TOKEN -ne '' -and ('${{ github.event_name }}' -ne 'pull_request' -or '${{ github.event.pull_request.head.repo.full_name }}' -eq '${{ github.repository }}')) {
            dotnet-coverage collect "dotnet test tests/Dreamine.MVVM.Core.Tests/Dreamine.MVVM.Core.Tests.csproj --configuration Release --no-build" -f xml -o coverage.xml
          }
          else {
            dotnet test tests/Dreamine.MVVM.Core.Tests/Dreamine.MVVM.Core.Tests.csproj --configuration Release --no-build
          }

      - name: Pack
        working-directory: src/Core
        run: dotnet pack Dreamine.MVVM.Core.csproj --configuration Release --no-build --output artifacts

      - name: End Sonar analysis
        if: success() && env.SONAR_TOKEN != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        working-directory: src/Core
        shell: pwsh
        run: dotnet sonarscanner end /d:sonar.token="$env:SONAR_TOKEN"
